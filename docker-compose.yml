services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dosmart_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
    networks:
      - dosmart

  nginx:
    image: nginx:alpine
    container_name: dosmart_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dosmart

  postgres:
    image: postgres:16-alpine
    container_name: dosmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dosmart
      POSTGRES_USER: dosmart
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dosmart

networks:
  dosmart:
    driver: bridge

volumes:
  postgres_data:
